<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval RPG // PixelForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #111; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Styl okna dialogowego w starym klimacie */
        .rpg-dialogue {
            background: rgba(20, 15, 10, 0.95);
            border: 2px solid #5a4b3c;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
            font-family: 'Times New Roman', serif;
        }
        .rpg-option:hover { background: rgba(90, 75, 60, 0.3); color: #e5d3b3; }
    </style>
</head>
<body class="text-neutral-200 antialiased">

    <!-- Kontener 3D -->
    <div id="canvas-container"></div>

    <!-- UI: Powrót i Info -->
    <div class="absolute top-4 left-4 z-20 flex flex-col gap-2 pointer-events-none">
        <a href="../../index.html" class="bg-neutral-900/80 border border-neutral-700 px-4 py-2 rounded text-xs font-bold text-neutral-400 hover:text-amber-500 transition pointer-events-auto">
            <i class="fa-solid fa-arrow-left"></i> Opuść wioskę
        </a>
        <div class="bg-neutral-900/80 border border-neutral-700 px-4 py-2 rounded text-xs text-neutral-400">
            Prawy przycisk myszy / Kliknięcie: <span class="text-amber-500 font-bold">Poruszanie się</span><br>
            Kliknij na czerwoną postać: <span class="text-amber-500 font-bold">Rozmowa</span>
        </div>
    </div>

    <!-- UI: Ekran Dialogu (domyślnie ukryty) -->
    <div id="dialogue-ui" class="absolute bottom-8 left-1/2 -translate-x-1/2 z-30 w-full max-w-3xl hidden">
        <div class="rpg-dialogue rounded-lg p-6">
            <div class="flex items-end gap-4 mb-4 border-b border-[#5a4b3c] pb-4">
                <div class="w-16 h-16 bg-neutral-800 border border-[#5a4b3c] flex items-center justify-center text-3xl">🧌</div>
                <div>
                    <h3 class="text-amber-600 font-bold text-xl tracking-wider uppercase" id="npc-name">Strażnik Obozu</h3>
                    <p class="text-lg text-neutral-300 italic mt-1" id="npc-text">"Czego tu szukasz? Lepiej nie kręć się przy zamku, jeśli zależy Ci na głowie."</p>
                </div>
            </div>
            
            <div class="flex flex-col gap-1" id="dialogue-options">
                <!-- Opcje generowane przez JS -->
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, raycaster, mouse;
        let player, targetPosition;
        let npcs = [];
        let isDialogueActive = false;

        function init() {
            // Scena i Mgła (mroczny klimat)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);
            scene.fog = new THREE.FogExp2(0x1a1a24, 0.04);

            // Kamera izometryczna
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(15, 20, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            setupLighting();
            buildEnvironment();
            createPlayer();
            createNPC();

            // Nasłuchiwanie kliknięć
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function setupLighting() {
            const ambient = new THREE.AmbientLight(0x2a2a35, 1);
            scene.add(ambient);

            const moonLight = new THREE.DirectionalLight(0x4a5a80, 1.5);
            moonLight.position.set(20, 30, -10);
            moonLight.castShadow = true;
            moonLight.shadow.camera.left = -20;
            moonLight.shadow.camera.right = 20;
            moonLight.shadow.camera.top = 20;
            moonLight.shadow.camera.bottom = -20;
            scene.add(moonLight);
        }

        function buildEnvironment() {
            // Ziemia
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x223322, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            ground.name = "ground";
            scene.add(ground);

            // Prosty zarys murów zamku
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 });
            for(let i=0; i<5; i++) {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 4), wallMat);
                wall.position.set(-10 + i*4, 3, -15);
                wall.castShadow = true; wall.receiveShadow = true;
                scene.add(wall);
            }

            // Ognisko (światło)
            const fire = new THREE.PointLight(0xff6600, 2, 15);
            fire.position.set(5, 1, -5);
            scene.add(fire);
            
            const fireMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 0.5, 1), new THREE.MeshBasicMaterial({color: 0xff3300}));
            fireMesh.position.set(5, 0.25, -5);
            scene.add(fireMesh);
        }

        function createPlayer() {
            // Tymczasowy model gracza (niebieski pionek)
            const geo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0x2563eb });
            player = new THREE.Mesh(geo, mat);
            player.position.set(0, 1, 0);
            player.castShadow = true;
            scene.add(player);
            
            targetPosition = player.position.clone();
        }

        function createNPC() {
            // Tymczasowy model NPC (czerwony pionek przy ognisku)
            const geo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xdc2626 });
            const npc = new THREE.Mesh(geo, mat);
            npc.position.set(3, 1, -5); // Stoi blisko ogniska
            npc.castShadow = true;
            npc.name = "npc_guard";
            scene.add(npc);
            npcs.push(npc);
        }

        function onPointerDown(event) {
            if (isDialogueActive) return; // Zablokuj chodzenie podczas rozmowy

            // Obliczanie pozycji kliknięcia
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Sprawdź czy kliknięto NPC
            const npcIntersects = raycaster.intersectObjects(npcs);
            if (npcIntersects.length > 0) {
                const clickedNPC = npcIntersects[0].object;
                const distance = player.position.distanceTo(clickedNPC.position);
                
                if (distance < 4) {
                    startDialogue();
                } else {
                    // Jeśli za daleko, po prostu podejdź bliżej NPC
                    targetPosition.copy(clickedNPC.position);
                }
                return;
            }

            // Sprawdź czy kliknięto ziemię
            const groundIntersect = raycaster.intersectObjects(scene.children).filter(obj => obj.object.name === "ground");
            if (groundIntersect.length > 0) {
                targetPosition.copy(groundIntersect[0].point);
                targetPosition.y = 1; // Utrzymaj gracza na ziemi
            }
        }

        // --- SYSTEM DIALOGOWY ---
        const dialogueUI = document.getElementById('dialogue-ui');
        const npcText = document.getElementById('npc-text');
        const optionsContainer = document.getElementById('dialogue-options');

        function startDialogue() {
            isDialogueActive = true;
            targetPosition.copy(player.position); // Zatazymaj gracza
            dialogueUI.classList.remove('hidden');
            loadDialogueNode(0);
        }

        function endDialogue() {
            isDialogueActive = false;
            dialogueUI.classList.add('hidden');
        }

        // Klasyczne drzewko dialogowe
        const dialogueTree = {
            0: {
                text: '"Czego tu szukasz? Lepiej nie kręć się przy zamku, jeśli zależy Ci na głowie."',
                options: [
                    { text: "Powiedz mi, kto tu rządzi.", next: 1 },
                    { text: "Pokaż mi swoje towary.", next: 2 },
                    { text: "(Odejdź)", next: -1 }
                ]
            },
            1: {
                text: '"A jak myślisz? To włości Barona. Jeśli chcesz z nim rozmawiać, musisz najpierw zasłużyć na szacunek w wiosce."',
                options: [
                    { text: "Wrócę do tego później.", next: 0 }
                ]
            },
            2: {
                text: '"Nie jestem handlarzem, ślepoto. Idź na targowisko na tyłach zamku."',
                options: [
                    { text: "Dzięki.", next: 0 }
                ]
            }
        };

        function loadDialogueNode(nodeId) {
            if (nodeId === -1) {
                endDialogue();
                return;
            }

            const node = dialogueTree[nodeId];
            npcText.innerText = node.text;
            optionsContainer.innerHTML = '';

            node.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "rpg-option text-left px-4 py-2 text-[#b09e87] transition duration-200 cursor-pointer w-full border border-transparent hover:border-[#5a4b3c] rounded";
                btn.innerText = opt.text;
                btn.onclick = () => loadDialogueNode(opt.next);
                optionsContainer.appendChild(btn);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Płynne poruszanie gracza (Lerp)
            if (!isDialogueActive) {
                player.position.lerp(targetPosition, 0.05);
                
                // Kamera podąża za graczem
                camera.position.x = player.position.x + 15;
                camera.position.z = player.position.z + 15;
                camera.lookAt(player.position);
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
