<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Drive 3D // PixelForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #050505; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .hud-glass {
            background: rgba(10, 10, 15, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.08);
        }
    </style>
</head>
<body class="text-white font-sans">

    <!-- Kontener 3D -->
    <div id="canvas-container"></div>

    <!-- Pasek powrotu do strony głównej -->
    <div class="absolute top-4 left-4 z-20">
        <a href="../../index.html" class="hud-glass px-4 py-2 rounded-xl text-xs font-bold text-neutral-300 hover:text-cyan-400 hover:border-cyan-400/60 transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Wróć do PixelForge
        </a>
    </div>

    <!-- Interfejs HUD -->
    <div id="hud" class="absolute top-4 right-4 z-20 flex gap-4 pointer-events-none">
        <div class="hud-glass px-5 py-3 rounded-2xl flex flex-col items-end">
            <span class="text-[10px] text-cyan-400 font-mono tracking-widest uppercase">Prędkość</span>
            <div class="flex items-baseline gap-1">
                <span id="speed-val" class="text-3xl font-black font-mono tracking-tight text-white">0</span>
                <span class="text-xs text-neutral-400 font-mono">KM/H</span>
            </div>
        </div>
        <div class="hud-glass px-5 py-3 rounded-2xl flex flex-col items-end">
            <span class="text-[10px] text-fuchsia-400 font-mono tracking-widest uppercase">Wynik</span>
            <span id="score-val" class="text-3xl font-black font-mono tracking-tight text-white">0</span>
        </div>
    </div>

    <!-- Pasek Nitro -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-72 pointer-events-none">
        <div class="flex justify-between text-[10px] font-mono mb-1.5 px-1">
            <span class="text-cyan-400 uppercase tracking-wider"><i class="fa-solid fa-bolt"></i> Nitro Boost (Spacja)</span>
            <span id="nitro-text" class="text-neutral-400">100%</span>
        </div>
        <div class="w-full h-2.5 bg-neutral-900/80 rounded-full overflow-hidden p-0.5 border border-cyan-500/30">
            <div id="nitro-bar" class="h-full bg-gradient-to-r from-cyan-500 to-fuchsia-500 rounded-full transition-all duration-75" style="width: 100%;"></div>
        </div>
    </div>

    <!-- Ekran Startowy -->
    <div id="start-screen" class="absolute inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="hud-glass max-w-md w-full p-8 rounded-3xl text-center border-cyan-500/40">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-cyan-500 to-fuchsia-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-car-side text-2xl text-black"></i>
            </div>
            <h1 class="text-3xl font-black tracking-wider uppercase mb-2 bg-gradient-to-r from-cyan-400 to-fuchsia-400 bg-clip-text text-transparent">
                Neon Drive 3D
            </h1>
            <p class="text-neutral-400 text-sm mb-6">
                Użyj <span class="text-white font-bold">A / D</span> lub <span class="text-white font-bold">Strzałek</span> do skręcania.<br>
                Przytrzymaj <span class="text-cyan-400 font-bold">Spację</span>, aby odpalić dopalacz Nitro!
            </p>
            <button id="start-btn" class="w-full py-3.5 px-6 rounded-xl font-black text-black bg-gradient-to-r from-cyan-400 to-fuchsia-500 hover:opacity-90 shadow-lg shadow-cyan-500/25 transition">
                ROZPOCZNIJ JAZDĘ
            </button>
        </div>
    </div>

    <!-- Ekran Game Over -->
    <div id="game-over-screen" class="absolute inset-0 z-30 flex items-center justify-center bg-black/90 backdrop-blur-md hidden">
        <div class="hud-glass max-w-sm w-full p-8 rounded-3xl text-center border-red-500/40">
            <h2 class="text-3xl font-black text-red-500 mb-2">KOLIZJA!</h2>
            <p class="text-neutral-400 text-sm mb-4">Twój ostateczny wynik:</p>
            <div id="final-score" class="text-4xl font-mono font-black text-white mb-6">0</div>
            <button id="restart-btn" class="w-full py-3 px-6 rounded-xl font-bold bg-neutral-100 text-black hover:bg-cyan-400 transition mb-3">
                ZAGRAJ PONOWNIE
            </button>
            <a href="../../index.html" class="block text-xs text-neutral-400 hover:text-white transition">Wróć do menu głównego</a>
        </div>
    </div>

    <script>
        let scene, camera, renderer, playerCar;
        let traffic = [];
        let scenery = [];
        let roadMarks = [];
        let isPlaying = false;
        let speed = 0;
        let maxSpeed = 160;
        let score = 0;
        let nitro = 100;
        let keys = { left: false, right: false, nitro: false };

        const ROAD_WIDTH = 14;
        const SPEED_FACTOR = 0.05;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050508, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.2, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // Oświetlenie
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0x00f3ff, 0.8);
            sun.position.set(0, 20, -10);
            scene.add(sun);

            createRoad();
            createPlayerCar();
            createScenery();

            window.addEventListener('resize', onWindowResize);
            setupInput();
        }

        function createRoad() {
            // Asfalt
            const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, 600);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0f, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -150;
            scene.add(road);

            // Linie na jezdni
            const lineGeo = new THREE.PlaneGeometry(0.25, 6);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            for (let i = 0; i < 40; i++) {
                const mark = new THREE.Mesh(lineGeo, lineMat);
                mark.rotation.x = -Math.PI / 2;
                mark.position.set(0, 0.02, -i * 15);
                scene.add(mark);
                roadMarks.push(mark);
            }
        }

        function createPlayerCar() {
            playerCar = new THREE.Group();

            // Karoseria
            const bodyGeo = new THREE.BoxGeometry(1.6, 0.55, 3.4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            playerCar.add(body);

            // Dach / szyba
            const cabinGeo = new THREE.BoxGeometry(1.3, 0.45, 1.6);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.85, -0.2);
            playerCar.add(cabin);

            // Tylne światła neonowe
            const tailGeo = new THREE.BoxGeometry(1.4, 0.1, 0.1);
            const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const tailLight = new THREE.Mesh(tailGeo, tailMat);
            tailLight.position.set(0, 0.55, 1.71);
            playerCar.add(tailLight);

            // Underglow (neon pod autem)
            const underglow = new THREE.PointLight(0x00f3ff, 2.5, 4);
            underglow.position.set(0, 0.1, 0);
            playerCar.add(underglow);

            playerCar.position.set(0, 0, 0);
            scene.add(playerCar);
        }

        function spawnTrafficCar() {
            const car = new THREE.Group();
            const colors = [0xff0055, 0x9333ea, 0x10b981, 0xf59e0b];
            const color = colors[Math.floor(Math.random() * colors.length)];

            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 0.55, 3.2),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 })
            );
            body.position.y = 0.5;
            car.add(body);

            // Losowy pas ruchu (z 3 pasów)
            const lanes = [-4, 0, 4];
            car.position.x = lanes[Math.floor(Math.random() * lanes.length)];
            car.position.z = -180;
            car.userData = { speed: 40 + Math.random() * 30 };

            scene.add(car);
            traffic.push(car);
        }

        function createScenery() {
            // Neonowe wieżowce po bokach
            const buildingGeo = new THREE.BoxGeometry(8, 30, 8);
            for (let i = 0; i < 30; i++) {
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x080811, 
                    roughness: 0.9 
                });
                const bLeft = new THREE.Mesh(buildingGeo, mat);
                bLeft.position.set(-15 - Math.random() * 8, 15, -i * 20);
                scene.add(bLeft);
                scenery.push(bLeft);

                const bRight = new THREE.Mesh(buildingGeo, mat);
                bRight.position.set(15 + Math.random() * 8, 15, -i * 20);
                scene.add(bRight);
                scenery.push(bRight);
            }
        }

        function setupInput() {
            window.addEventListener('keydown', (e) => {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
                if (e.code === 'Space') keys.nitro = true;
            });
            window.addEventListener('keyup', (e) => {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
                if (e.code === 'Space') keys.nitro = false;
            });

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', restartGame);
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            isPlaying = true;
            speed = 90;
        }

        function restartGame() {
            document.getElementById('game-over-screen').classList.add('hidden');
            traffic.forEach(c => scene.remove(c));
            traffic = [];
            playerCar.position.x = 0;
            score = 0;
            nitro = 100;
            speed = 90;
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('final-score').innerText = Math.floor(score);
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let lastTrafficSpawn = 0;

        function animate(time) {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // Obsługa nitro
                let targetMaxSpeed = 140;
                if (keys.nitro && nitro > 0) {
                    targetMaxSpeed = 220;
                    nitro = Math.max(0, nitro - 0.4);
                } else {
                    nitro = Math.min(100, nitro + 0.1);
                }

                speed += (targetMaxSpeed - speed) * 0.02;

                // Sterowanie lewo/prawo z przechyłem auta
                if (keys.left && playerCar.position.x > -ROAD_WIDTH/2 + 1.2) {
                    playerCar.position.x -= 0.12;
                    playerCar.rotation.z = 0.08;
                } else if (keys.right && playerCar.position.x < ROAD_WIDTH/2 - 1.2) {
                    playerCar.position.x += 0.12;
                    playerCar.rotation.z = -0.08;
                } else {
                    playerCar.rotation.z *= 0.85;
                }

                // Ruch linii na drodze
                roadMarks.forEach(mark => {
                    mark.position.z += speed * SPEED_FACTOR;
                    if (mark.position.z > 10) mark.position.z = -250;
                });

                // Ruch otoczenia
                scenery.forEach(b => {
                    b.position.z += speed * SPEED_FACTOR;
                    if (b.position.z > 20) b.position.z = -300;
                });

                // Spawnowanie innych aut
                if (time - lastTrafficSpawn > 1200) {
                    spawnTrafficCar();
                    lastTrafficSpawn = time;
                }

                // Aktualizacja aut w ruchu i kolizje
                for (let i = traffic.length - 1; i >= 0; i--) {
                    const car = traffic[i];
                    car.position.z += (speed - car.userData.speed) * SPEED_FACTOR;

                    // Detekcja kolizji (Bounding Box)
                    const distZ = Math.abs(car.position.z - playerCar.position.z);
                    const distX = Math.abs(car.position.x - playerCar.position.x);

                    if (distZ < 2.6 && distX < 1.4) {
                        gameOver();
                    }

                    // Usuwanie aut za kamerą
                    if (car.position.z > 15) {
                        scene.remove(car);
                        traffic.splice(i, 1);
                    }
                }

                // Punktacja i HUD
                score += speed * 0.005;
                document.getElementById('speed-val').innerText = Math.floor(speed);
                document.getElementById('score-val').innerText = Math.floor(score);
                document.getElementById('nitro-bar').style.width = nitro + '%';
                document.getElementById('nitro-text').innerText = Math.floor(nitro) + '%';

                // Drżenie kamery przy dużej prędkości
                camera.position.x = (Math.random() - 0.5) * (speed / 1000);
            }

            renderer.render(scene, camera);
        }

        init();
        animate(0);
    </script>
</body>
</html>
