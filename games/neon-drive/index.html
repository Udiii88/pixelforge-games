<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Drive 3D // PixelForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #020205; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .hud-glass {
            background: rgba(5, 5, 10, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
        }
    </style>
</head>
<body class="text-white font-sans">

    <div id="canvas-container"></div>

    <!-- Pasek powrotu -->
    <div class="absolute top-4 left-4 z-20">
        <a href="../../index.html" class="hud-glass px-4 py-2 rounded-xl text-xs font-bold text-neutral-300 hover:text-cyan-400 transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Wróć do PixelForge
        </a>
    </div>

    <!-- HUD -->
    <div id="hud" class="absolute top-4 right-4 z-20 flex gap-4 pointer-events-none">
        <div class="hud-glass px-5 py-3 rounded-2xl flex flex-col items-end border-cyan-500/30">
            <span class="text-[10px] text-cyan-400 font-mono tracking-widest uppercase shadow-cyan-500">Prędkość</span>
            <div class="flex items-baseline gap-1">
                <span id="speed-val" class="text-3xl font-black font-mono tracking-tight text-white drop-shadow-[0_0_8px_rgba(0,243,255,0.8)]">0</span>
                <span class="text-xs text-neutral-400 font-mono">KM/H</span>
            </div>
        </div>
        <div class="hud-glass px-5 py-3 rounded-2xl flex flex-col items-end border-fuchsia-500/30">
            <span class="text-[10px] text-fuchsia-400 font-mono tracking-widest uppercase">Wynik</span>
            <span id="score-val" class="text-3xl font-black font-mono tracking-tight text-white drop-shadow-[0_0_8px_rgba(217,70,239,0.8)]">0</span>
        </div>
    </div>

    <!-- Nitro -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-72 pointer-events-none">
        <div class="flex justify-between text-[10px] font-mono mb-1.5 px-1">
            <span class="text-cyan-400 uppercase tracking-wider font-bold"><i class="fa-solid fa-bolt"></i> Nitro (Spacja)</span>
            <span id="nitro-text" class="text-white font-bold drop-shadow-[0_0_5px_rgba(0,243,255,0.8)]">100%</span>
        </div>
        <div class="w-full h-3 bg-neutral-900/90 rounded-full overflow-hidden p-0.5 border border-cyan-500/50 shadow-[0_0_15px_rgba(0,243,255,0.2)]">
            <div id="nitro-bar" class="h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-500 rounded-full transition-all duration-75" style="width: 100%;"></div>
        </div>
    </div>

    <!-- Ekrany Start/Koniec -->
    <div id="start-screen" class="absolute inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="hud-glass max-w-md w-full p-8 rounded-3xl text-center border-cyan-500/50 shadow-[0_0_50px_rgba(0,243,255,0.1)]">
            <h1 class="text-4xl font-black tracking-widest uppercase mb-2 bg-gradient-to-r from-cyan-400 via-blue-400 to-fuchsia-400 bg-clip-text text-transparent drop-shadow-[0_0_10px_rgba(0,243,255,0.4)]">Neon Drive</h1>
            <p class="text-neutral-300 text-sm mb-6 font-mono">A / D lub Strzałki do skręcania.<br>Spacja odpala dopalacz.</p>
            <button id="start-btn" class="w-full py-4 px-6 rounded-xl font-black text-black bg-gradient-to-r from-cyan-400 to-fuchsia-500 hover:opacity-90 shadow-[0_0_20px_rgba(0,243,255,0.4)] transition hover:scale-105 duration-200">START</button>
        </div>
    </div>

    <div id="game-over-screen" class="absolute inset-0 z-30 flex items-center justify-center bg-black/90 backdrop-blur-md hidden">
        <div class="hud-glass max-w-sm w-full p-8 rounded-3xl text-center border-fuchsia-500/50">
            <h2 class="text-4xl font-black text-fuchsia-500 mb-2 drop-shadow-[0_0_15px_rgba(217,70,239,0.8)]">ROZBITY!</h2>
            <div id="final-score" class="text-5xl font-mono font-black text-white mb-6">0</div>
            <button id="restart-btn" class="w-full py-3 px-6 rounded-xl font-bold bg-white text-black hover:bg-cyan-400 transition mb-3">JESZCZE RAZ</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, playerCar, synthGrid;
        let traffic = [], scenery = [];
        let isPlaying = false, speed = 0, score = 0, nitro = 100;
        let keys = { left: false, right: false, nitro: false };

        const ROAD_WIDTH = 16;
        const SPEED_FACTOR = 0.05;

        function init() {
            scene = new THREE.Scene();
            // Ciemniejsza mgła dla lepszego kontrastu neonów
            scene.fog = new THREE.FogExp2(0x020205, 0.02);

            // Odsunięta i podniesiona kamera (poprzednio: 0, 3.2, 7)
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 11);
            camera.lookAt(0, 0, -10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Wyższa jakość kolorów
            renderer.outputEncoding = THREE.sRGBEncoding; 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Nowoczesne oświetlenie
            scene.add(new THREE.AmbientLight(0x111122, 1.5));
            const directionalLight = new THREE.DirectionalLight(0x00f3ff, 2);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);
            
            const backLight = new THREE.DirectionalLight(0xff0055, 2);
            backLight.position.set(-10, 10, -20);
            scene.add(backLight);

            createEnvironment();
            createPlayerCar();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            document.addEventListener('keydown', (e) => {
                if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=true;
                if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=true;
                if(e.code==='Space') keys.nitro=true;
            });
            document.addEventListener('keyup', (e) => {
                if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false;
                if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false;
                if(e.code==='Space') keys.nitro=false;
            });

            document.getElementById('start-btn').onclick = () => {
                document.getElementById('start-screen').classList.add('hidden');
                isPlaying = true; speed = 90;
            };
            document.getElementById('restart-btn').onclick = () => {
                document.getElementById('game-over-screen').classList.add('hidden');
                traffic.forEach(c => scene.remove(c)); traffic = [];
                playerCar.position.x = 0; playerCar.rotation.z = 0;
                score = 0; nitro = 100; speed = 90; isPlaying = true;
            };
        }

        function createEnvironment() {
            // Asfalt
            const road = new THREE.Mesh(
                new THREE.PlaneGeometry(ROAD_WIDTH, 600), 
                new THREE.MeshStandardMaterial({ color: 0x050508, roughness: 0.2, metalness: 0.8 })
            );
            road.rotation.x = -Math.PI / 2; 
            road.position.z = -150; 
            scene.add(road);

            // Neonowa siatka na drodze (efekt Synthwave)
            synthGrid = new THREE.GridHelper(ROAD_WIDTH, 10, 0x00f3ff, 0xff0055);
            synthGrid.position.y = 0.02;
            synthGrid.position.z = -5;
            // Wydłużamy siatkę
            synthGrid.scale.set(1, 1, 30); 
            scene.add(synthGrid);

            // Paski krawędziowe
            const edgeGeo = new THREE.PlaneGeometry(0.3, 600);
            const edgeMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            const leftEdge = new THREE.Mesh(edgeGeo, edgeMat);
            leftEdge.rotation.x = -Math.PI / 2; leftEdge.position.set(-ROAD_WIDTH/2, 0.05, -150);
            scene.add(leftEdge);
            
            const rightEdge = new THREE.Mesh(edgeGeo, new THREE.MeshBasicMaterial({ color: 0xff0055 }));
            rightEdge.rotation.x = -Math.PI / 2; rightEdge.position.set(ROAD_WIDTH/2, 0.05, -150);
            scene.add(rightEdge);

            // Budynki
            for (let i = 0; i < 40; i++) {
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x030308, 
                    roughness: 0.1, 
                    metalness: 1.0,
                    emissive: [0x00f3ff, 0xff0055, 0x9333ea][i%3],
                    emissiveIntensity: 0.2
                });
                
                const height = 15 + Math.random() * 30;
                const bL = new THREE.Mesh(new THREE.BoxGeometry(6, height, 6), mat);
                bL.position.set(-14 - Math.random()*10, height/2, -i*15); 
                scene.add(bL); scenery.push(bL);
                
                const bR =
