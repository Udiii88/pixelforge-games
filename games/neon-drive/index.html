<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Drive 3D // PixelForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #020205; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .hud-glass { background: rgba(5, 5, 10, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(0, 243, 255, 0.3); }
    </style>
</head>
<body class="text-white font-sans">

    <div id="debug-screen" class="absolute top-20 left-1/2 -translate-x-1/2 z-50 bg-red-900/90 border border-red-500 text-white p-6 rounded-xl hidden max-w-xl w-full font-mono text-sm shadow-2xl">
        <h3 class="font-bold text-lg mb-2">SYSTEM WYKRYŁ BŁĄD:</h3>
        <div id="debug-log"></div>
    </div>

    <div id="canvas-container"></div>

    <div class="absolute top-4 left-4 z-20">
        <a href="../../index.html" class="hud-glass px-4 py-2 rounded-xl text-xs font-bold text-neutral-300 hover:text-cyan-400 transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Wróć do PixelForge
        </a>
    </div>

    <div id="hud" class="absolute top-4 right-4 z-20 flex gap-4 pointer-events-none">
        <div class="hud-glass px-5 py-3 rounded-2xl flex flex-col items-end border-cyan-500/30">
            <span class="text-[10px] text-cyan-400 font-mono tracking-widest uppercase">Prędkość</span>
            <div class="flex items-baseline gap-1">
                <span id="speed-val" class="text-3xl font-black font-mono tracking-tight text-white">0</span>
                <span class="text-xs text-neutral-400 font-mono">KM/H</span>
            </div>
        </div>
        <div class="hud-glass px-5 py-3 rounded-2xl flex flex-col items-end border-fuchsia-500/30">
            <span class="text-[10px] text-fuchsia-400 font-mono tracking-widest uppercase">Wynik</span>
            <span id="score-val" class="text-3xl font-black font-mono tracking-tight text-white">0</span>
        </div>
    </div>

    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-72 pointer-events-none">
        <div class="flex justify-between text-[10px] font-mono mb-1.5 px-1">
            <span class="text-cyan-400 uppercase tracking-wider font-bold"><i class="fa-solid fa-bolt"></i> Nitro (Spacja)</span>
            <span id="nitro-text" class="text-white font-bold">100%</span>
        </div>
        <div class="w-full h-3 bg-neutral-900/90 rounded-full overflow-hidden p-0.5 border border-cyan-500/50">
            <div id="nitro-bar" class="h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-500 rounded-full transition-all duration-75" style="width: 100%;"></div>
        </div>
    </div>

    <div id="start-screen" class="absolute inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="hud-glass max-w-md w-full p-8 rounded-3xl text-center border-cyan-500/50">
            <h1 class="text-4xl font-black tracking-widest uppercase mb-2 bg-gradient-to-r from-cyan-400 to-fuchsia-400 bg-clip-text text-transparent">Neon Drive</h1>
            <p class="text-neutral-300 text-sm mb-6 font-mono">A / D lub Strzałki do skręcania.</p>
            <button id="start-btn" class="w-full py-4 px-6 rounded-xl font-black text-black bg-gradient-to-r from-cyan-400 to-fuchsia-500 hover:opacity-90 transition hover:scale-105 duration-200 cursor-pointer pointer-events-auto">START</button>
        </div>
    </div>

    <script>
        const debugScreen = document.getElementById('debug-screen');
        const debugLog = document.getElementById('debug-log');

        window.onerror = function(msg, url, line) {
            debugScreen.classList.remove('hidden');
            debugLog.innerHTML += `<p class="mt-2">- ${msg} (linia ${line})</p>`;
        };

        let scene, camera, renderer, playerCar, synthGrid;
        let traffic = [], scenery = [];
        let isPlaying = false, speed = 0, score = 0;
        let keys = { left: false, right: false };

        function init() {
            if (typeof THREE === 'undefined') throw new Error("Biblioteka Three.js nie załadowała się!");

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020205, 0.02);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 11);
            camera.lookAt(0, 0, -10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x111122, 1.5));
            const dl = new THREE.DirectionalLight(0x00f3ff, 2);
            dl.position.set(10, 20, 10);
            scene.add(dl);

            createEnvironment();
            createPlayerCar();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            document.addEventListener('keydown', (e) => {
                if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=true;
                if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=true;
            });
            document.addEventListener('keyup', (e) => {
                if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false;
                if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false;
            });

            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-screen').classList.add('hidden');
                isPlaying = true; speed = 90;
            });

            animate();
        }

        function createEnvironment() {
            const road = new THREE.Mesh(new THREE.PlaneGeometry(16, 600), new THREE.MeshStandardMaterial({ color: 0x050508 }));
            road.rotation.x = -Math.PI / 2; road.position.z = -150; scene.add(road);

            synthGrid = new THREE.GridHelper(16, 10, 0x00f3ff, 0xff0055);
            synthGrid.position.set(0, 0.02, -5); synthGrid.scale.set(1, 1, 30); scene.add(synthGrid);

            for (let i = 0; i < 40; i++) {
                const bL = new THREE.Mesh(new THREE.BoxGeometry(6, 30, 6), new THREE.MeshStandardMaterial({ color: 0x030308, emissive: 0x00f3ff, emissiveIntensity: 0.2 }));
                bL.position.set(-14 - Math.random()*10, 15, -i*15); scene.add(bL); scenery.push(bL);
                const bR = new THREE.Mesh(new THREE.BoxGeometry(6, 30, 6), new THREE.MeshStandardMaterial({ color: 0x030308, emissive: 0xff0055, emissiveIntensity: 0.2 }));
                bR.position.set(14 + Math.random()*10, 15, -i*15); scene.add(bR); scenery.push(bR);
            }
        }

        function createPlayerCar() {
            playerCar = new THREE.Group();
            try {
                const loader = new THREE.GLTFLoader();
                loader.load('https://pub-e537566778374a93bce2bef55861ac68.r2.dev/car.glb', function(gltf) {
                    const model = gltf.scene;
                    model.scale.set(0.6, 0.6, 0.6); model.rotation.y = Math.PI; 
                    playerCar.add(model);
                }, undefined, function() {
                    const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 3.4), new THREE.MeshStandardMaterial({ color: 0x00f3ff }));
                    body.position.y = 0.5; playerCar.add(body);
                });
            } catch(e) {
                const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 3.4), new THREE.MeshStandardMaterial({ color: 0x00f3ff }));
                body.position.y = 0.5; playerCar.add(body);
            }
            scene.add(playerCar);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isPlaying) {
                speed += (160 - speed) * 0.03;
                if (keys.left && playerCar.position.x > -6.8) { playerCar.position.x -= 0.18; playerCar.rotation.z = 0.15; }
                else if (keys.right && playerCar.position.x < 6.8) { playerCar.position.x += 0.18; playerCar.rotation.z = -0.15; }
                else playerCar.rotation.z *= 0.8;

                synthGrid.position.z += speed * 0.05;
                if (synthGrid.position.z > 5) synthGrid.position.z = -5;

                scenery.forEach(b => { b.position.z += speed * 0.05; if(b.position.z>20) b.position.z = -300; });
                
                score += speed * 0.008;
                document.getElementById('speed-val').innerText = Math.floor(speed);
                document.getElementById('score-val').innerText = Math.floor(score);
            }
            if(renderer && scene && camera) renderer.render(scene, camera);
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            try { init(); } catch (err) { window.onerror(err.message, '', 'init'); }
        });
    </script>
</body>
</html>
