<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Drive 3D // PixelForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Dodany GLTFLoader do ładowania modeli -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #050505; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .hud-glass {
            background: rgba(10, 10, 15, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.08);
        }
    </style>
</head>
<body class="text-white font-sans">

    <!-- Kontener 3D -->
    <div id="canvas-container"></div>

    <!-- Pasek powrotu -->
    <div class="absolute top-4 left-4 z-20">
        <a href="../../index.html" class="hud-glass px-4 py-2 rounded-xl text-xs font-bold text-neutral-300 hover:text-cyan-400 transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Wróć do PixelForge
        </a>
    </div>

    <!-- HUD -->
    <div id="hud" class="absolute top-4 right-4 z-20 flex gap-4 pointer-events-none">
        <div class="hud-glass px-5 py-3 rounded-2xl flex flex-col items-end">
            <span class="text-[10px] text-cyan-400 font-mono tracking-widest uppercase">Prędkość</span>
            <div class="flex items-baseline gap-1">
                <span id="speed-val" class="text-3xl font-black font-mono tracking-tight text-white">0</span>
                <span class="text-xs text-neutral-400 font-mono">KM/H</span>
            </div>
        </div>
        <div class="hud-glass px-5 py-3 rounded-2xl flex flex-col items-end">
            <span class="text-[10px] text-fuchsia-400 font-mono tracking-widest uppercase">Wynik</span>
            <span id="score-val" class="text-3xl font-black font-mono tracking-tight text-white">0</span>
        </div>
    </div>

    <!-- Nitro -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-72 pointer-events-none">
        <div class="flex justify-between text-[10px] font-mono mb-1.5 px-1">
            <span class="text-cyan-400 uppercase tracking-wider"><i class="fa-solid fa-bolt"></i> Nitro (Spacja)</span>
            <span id="nitro-text" class="text-neutral-400">100%</span>
        </div>
        <div class="w-full h-2.5 bg-neutral-900/80 rounded-full overflow-hidden p-0.5 border border-cyan-500/30">
            <div id="nitro-bar" class="h-full bg-gradient-to-r from-cyan-500 to-fuchsia-500 rounded-full transition-all duration-75" style="width: 100%;"></div>
        </div>
    </div>

    <!-- Ekrany -->
    <div id="start-screen" class="absolute inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="hud-glass max-w-md w-full p-8 rounded-3xl text-center border-cyan-500/40">
            <h1 class="text-3xl font-black tracking-wider uppercase mb-2 bg-gradient-to-r from-cyan-400 to-fuchsia-400 bg-clip-text text-transparent">Neon Drive 3D</h1>
            <p class="text-neutral-400 text-sm mb-6">A / D lub Strzałki do skręcania.<br>Spacja to Nitro!</p>
            <button id="start-btn" class="w-full py-3.5 px-6 rounded-xl font-black text-black bg-gradient-to-r from-cyan-400 to-fuchsia-500 hover:opacity-90 shadow-lg shadow-cyan-500/25 transition">ROZPOCZNIJ JAZDĘ</button>
        </div>
    </div>

    <div id="game-over-screen" class="absolute inset-0 z-30 flex items-center justify-center bg-black/90 backdrop-blur-md hidden">
        <div class="hud-glass max-w-sm w-full p-8 rounded-3xl text-center border-red-500/40">
            <h2 class="text-3xl font-black text-red-500 mb-2">KOLIZJA!</h2>
            <div id="final-score" class="text-4xl font-mono font-black text-white mb-6">0</div>
            <button id="restart-btn" class="w-full py-3 px-6 rounded-xl font-bold bg-neutral-100 text-black hover:bg-cyan-400 transition mb-3">ZAGRAJ PONOWNIE</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, playerCar;
        let traffic = [], scenery = [], roadMarks = [];
        let isPlaying = false, speed = 0, score = 0, nitro = 100;
        let keys = { left: false, right: false, nitro: false };

        const ROAD_WIDTH = 14;
        const SPEED_FACTOR = 0.05;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050508, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.2, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const sun = new THREE.DirectionalLight(0x00f3ff, 0.8);
            sun.position.set(0, 20, -10);
            scene.add(sun);

            createRoad();
            createPlayerCar();
            createScenery();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            document.addEventListener('keydown', (e) => {
                if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=true;
                if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=true;
                if(e.code==='Space') keys.nitro=true;
            });
            document.addEventListener('keyup', (e) => {
                if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false;
                if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false;
                if(e.code==='Space') keys.nitro=false;
            });

            document.getElementById('start-btn').onclick = () => {
                document.getElementById('start-screen').classList.add('hidden');
                isPlaying = true; speed = 90;
            };
            document.getElementById('restart-btn').onclick = () => {
                document.getElementById('game-over-screen').classList.add('hidden');
                traffic.forEach(c => scene.remove(c)); traffic = [];
                playerCar.position.x = 0; score = 0; nitro = 100; speed = 90; isPlaying = true;
            };
        }

        function createRoad() {
            const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, 600), new THREE.MeshStandardMaterial({ color: 0x0a0a0f, roughness: 0.8 }));
            road.rotation.x = -Math.PI / 2; road.position.z = -150; scene.add(road);

            const lineMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            for (let i = 0; i < 40; i++) {
                const mark = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 6), lineMat);
                mark.rotation.x = -Math.PI / 2; mark.position.set(0, 0.02, -i * 15);
                scene.add(mark); roadMarks.push(mark);
            }
        }

        function createPlayerCar() {
            playerCar = new THREE.Group();
            
            // ŁADOWANIE MODELU Z CHMURY R2
            const loader = new THREE.GLTFLoader();
            const url = 'https://pub-e537566778374a93bce2bef55861ac68.r2.dev/car.glb';
            
            loader.load(url, function(gltf) {
                const model = gltf.scene;
                model.scale.set(1.5, 1.5, 1.5); // Skala modelu (zmień jeśli auto będzie za małe/duże)
                model.rotation.y = Math.PI; // Odwrócenie auta przodem
                playerCar.add(model);
            }, undefined, function(err) {
                console.log("Ładuję zapasowy model z klocków (brak pliku w chmurze)");
                const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 3.4), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
                body.position.y = 0.5; playerCar.add(body);
            });

            const underglow = new THREE.PointLight(0x00f3ff, 2.5, 4);
            underglow.position.set(0, 0.1, 0); playerCar.add(underglow);
            
            scene.add(playerCar);
        }

        function spawnTrafficCar() {
            const car = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 3.2), new THREE.MeshStandardMaterial({ color: [0xff0055, 0x9333ea, 0x10b981][Math.floor(Math.random()*3)] }));
            car.position.set([-4, 0, 4][Math.floor(Math.random()*3)], 0.5, -180);
            car.userData = { speed: 40 + Math.random() * 30 };
            scene.add(car); traffic.push(car);
        }

        function createScenery() {
            for (let i = 0; i < 30; i++) {
                const mat = new THREE.MeshStandardMaterial({ color: 0x080811, roughness: 0.9 });
                const bL = new THREE.Mesh(new THREE.BoxGeometry(8, 30, 8), mat);
                bL.position.set(-15 - Math.random()*8, 15, -i*20); scene.add(bL); scenery.push(bL);
                const bR = new THREE.Mesh(new THREE.BoxGeometry(8, 30, 8), mat);
                bR.position.set(15 + Math.random()*8, 15, -i*20); scene.add(bR); scenery.push(bR);
            }
        }

        let lastSpawn = 0;
        function animate(time) {
            requestAnimationFrame(animate);
            if (isPlaying) {
                let targetMax = (keys.nitro && nitro > 0) ? 220 : 140;
                if(keys.nitro && nitro > 0) nitro -= 0.4; else nitro = Math.min(100, nitro + 0.1);
                speed += (targetMax - speed) * 0.02;

                if (keys.left && playerCar.position.x > -ROAD_WIDTH/2 + 1.2) { playerCar.position.x -= 0.12; playerCar.rotation.z = 0.08; }
                else if (keys.right && playerCar.position.x < ROAD_WIDTH/2 - 1.2) { playerCar.position.x += 0.12; playerCar.rotation.z = -0.08; }
                else playerCar.rotation.z *= 0.85;

                roadMarks.forEach(m => { m.position.z += speed*SPEED_FACTOR; if(m.position.z>10) m.position.z = -250; });
                scenery.forEach(b => { b.position.z += speed*SPEED_FACTOR; if(b.position.z>20) b.position.z = -300; });

                if (time - lastSpawn > 1200) { spawnTrafficCar(); lastSpawn = time; }

                for (let i = traffic.length-1; i>=0; i--) {
                    const c = traffic[i];
                    c.position.z += (speed - c.userData.speed) * SPEED_FACTOR;
                    if (Math.abs(c.position.z - playerCar.position.z) < 2.6 && Math.abs(c.position.x - playerCar.position.x) < 1.4) {
                        isPlaying = false;
                        document.getElementById('final-score').innerText = Math.floor(score);
                        document.getElementById('game-over-screen').classList.remove('hidden');
                    }
                    if (c.position.z > 15) { scene.remove(c); traffic.splice(i, 1); }
                }

                score += speed * 0.005;
                document.getElementById('speed-val').innerText = Math.floor(speed);
                document.getElementById('score-val').innerText = Math.floor(score);
                document.getElementById('nitro-bar').style.width = nitro + '%';
                document.getElementById('nitro-text').innerText = Math.floor(nitro) + '%';
                camera.position.x = (Math.random() - 0.5) * (speed / 1000);
            }
            renderer.render(scene, camera);
        }
        init(); animate(0);
    </script>
</body>
</html>
